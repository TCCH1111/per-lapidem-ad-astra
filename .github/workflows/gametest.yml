# PLA: CI P1 — NeoForge game tests (w06 §4.2, R-BLD-11). Linux runner only: gametest needs Linux x64.
name: Game tests
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  gametest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run setup
      - name: Game tests (retry once on allowlisted flakiness)
        run: bash tools/ci/run-gametest.sh
      - name: Upload game-test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gametest-logs
          path: build/ci-logs/
          if-no-files-found: warn
