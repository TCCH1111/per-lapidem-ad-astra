# PLA: CI P0 — static + unit (w06 §4.2). Forked from upstream build.yml; adds ./gradlew check and i18n.
name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run setup
      # PLA: P0 adds the lint/compile gate and the i18n regression gate upstream does not run.
      - run: ./gradlew check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:i18n
      - run: ./gradlew build
      - uses: actions/upload-artifact@v6
        with:
          name: plaa-jars
          path: build/libs/*.jar
          if-no-files-found: error
  nightly:
    # PLA: nightly on our integration branch (upstream keys off master).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: plaa-jars
          path: jars
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -f jars/*-sources.jar
          gh release delete nightly --cleanup-tag --yes || true
          cat > notes.md <<EOF
          Built automatically from main at ${GITHUB_SHA::7}. Untested pre-release; back up your world before trying it.

          Install **plaa-core** and **plaa-vanilla**, plus LDLib2. Add **plaa-create** only with Create,
          and **plaa-modulargolems** only with Modular Golems. All plaa jars must come from the same build.
          EOF
          gh release create nightly jars/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes-file notes.md
