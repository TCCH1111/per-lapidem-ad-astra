modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/TCCH1111/per-lapidem-ad-astra/issues" # PLA: ADR-023 modid

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Per Lapidem ad Astra · Create" # PLA: ADR-023 modid
displayURL = "https://github.com/TCCH1111/per-lapidem-ad-astra" # PLA: ADR-023 modid
description = "What Create brings to a Folkways colony: residents drive its trains, send and collect parcels through its packaging and postboxes, lay its track, and take a schematic as a build order."
authors = "IzakyL (Folkways); TCCH1111 (Per Lapidem ad Astra)" # PLA: ADR-023 modid

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "plaa_core" # PLA: ADR-023 modid
type = "required"
reason = "Folkways × Create adds to the colony Folkways Core runs."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "plaa_vanilla" # PLA: ADR-023 modid
type = "required"
reason = "Rail and parcels are carried out by Folkways Vanilla's residents, and a schematic is built as Folkways Vanilla builds."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
reason = "Everything this mod adds is Create's."
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"

# PLA: ADR-023 modid — d12 R-FK-3: this fork and upstream Folkways cannot be installed together
[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "incompatible"
reason = "Per Lapidem ad Astra is a fork of Folkways; the two cannot share a world (one colony system). 本 mod 是 Folkways 的 fork，同一世界只能装一套殖民地系统。"
